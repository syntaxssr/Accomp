<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Accomp Phase 1 visual direction board</title>
  <desc id="desc">A visual moodboard for the Accomp marketing website showing the Shared Path concept, sage, sand and cream palette, typography, topographic lines, rounded cards, companion dots, and calm outdoor photography framing.</desc>

  <defs>
    <linearGradient id="heroGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C352F"/>
      <stop offset="0.5" stop-color="#171717"/>
      <stop offset="1" stop-color="#2C352F"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6ED"/>
      <stop offset="1" stop-color="#DCCFC0"/>
    </linearGradient>
    <linearGradient id="photoWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#778873"/>
      <stop offset="0.55" stop-color="#4F5F52"/>
      <stop offset="1" stop-color="#2C352F"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#171717" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#171717" flood-opacity="0.12"/>
    </filter>
    <clipPath id="photoClip">
      <rect x="1108" y="682" width="402" height="218" rx="32"/>
    </clipPath>
    <pattern id="contourPattern" width="180" height="140" patternUnits="userSpaceOnUse">
      <path d="M-20 88C18 42 56 32 92 58s66 20 110-18" fill="none" stroke="#A1BC98" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M-26 112C20 66 62 52 102 76s66 18 106-10" fill="none" stroke="#A1BC98" stroke-opacity="0.13" stroke-width="2"/>
      <path d="M-18 136C32 94 70 82 112 102s68 16 102-4" fill="none" stroke="#A1BC98" stroke-opacity="0.09" stroke-width="2"/>
      <path d="M28 10C52 24 82 24 106 8s52-12 82 10" fill="none" stroke="#A1BC98" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#FDF6ED"/>

  <!-- Header -->
  <text x="90" y="78" font-family="Geist, Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#1F1F1F">Accomp</text>
  <circle cx="195" cy="70" r="6" fill="#778873"/>
  <circle cx="213" cy="70" r="6" fill="#A1BC98"/>
  <text x="240" y="77" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="2.2" fill="#5D685F">PHASE 1 · VISUAL DIRECTION</text>
  <rect x="1320" y="44" width="190" height="48" rx="24" fill="#778873"/>
  <text x="1415" y="75" text-anchor="middle" font-family="Geist, Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#171717">Adventure Together.</text>

  <!-- Main concept panel -->
  <rect x="90" y="126" width="930" height="520" rx="42" fill="url(#heroGlow)" filter="url(#softShadow)"/>
  <rect x="90" y="126" width="930" height="520" rx="42" fill="url(#contourPattern)"/>

  <text x="145" y="192" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#A1BC98">CORE CONCEPT</text>
  <text x="145" y="257" font-family="Geist, Inter, Arial, sans-serif" font-size="58" font-weight="500" fill="#FDF6ED">The Shared Path</text>
  <text x="145" y="301" font-family="Inter, Arial, sans-serif" font-size="18" fill="#DCCFC0">Separate plans become one shared adventure.</text>

  <!-- Shared paths -->
  <path d="M115 490C252 448 326 405 414 416C515 429 570 514 694 487C795 466 850 392 995 370" fill="none" stroke="#DCCFC0" stroke-width="8" stroke-linecap="round"/>
  <path d="M102 356C253 367 315 496 434 492C548 488 607 399 708 424C814 450 866 508 1001 519" fill="none" stroke="#778873" stroke-width="8" stroke-linecap="round"/>
  <circle cx="215" cy="449" r="15" fill="#FDF6ED"/>
  <circle cx="240" cy="406" r="15" fill="#778873"/>
  <circle cx="706" cy="430" r="10" fill="#FDF6ED"/>
  <circle cx="728" cy="432" r="10" fill="#778873"/>

  <!-- Phone -->
  <g filter="url(#smallShadow)">
    <rect x="495" y="327" width="208" height="268" rx="34" fill="#111815" stroke="#5B6C63" stroke-width="2"/>
    <rect x="509" y="343" width="180" height="236" rx="24" fill="url(#screenGlow)"/>
    <rect x="566" y="350" width="66" height="8" rx="4" fill="#1F1F1F"/>
    <text x="530" y="392" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#5D685F">WEEKEND TRIP</text>
    <text x="530" y="420" font-family="Geist, Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F1F1F">Khao Yai</text>
    <circle cx="536" cy="452" r="11" fill="#778873"/>
    <circle cx="556" cy="452" r="11" fill="#A1BC98"/>
    <circle cx="576" cy="452" r="11" fill="#2C352F"/>
    <text x="596" y="457" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5D685F">4 companions</text>
    <rect x="528" y="481" width="142" height="1" fill="#DCCFC0"/>
    <circle cx="537" cy="509" r="7" fill="#778873"/>
    <path d="M534 509l2 2 4-5" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="555" y="514" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1F1F1F">Shared gear ready</text>
    <circle cx="537" cy="541" r="7" fill="#A1BC98"/>
    <text x="555" y="546" font-family="Inter, Arial, sans-serif" font-size="12" fill="#1F1F1F">Offline map saved</text>
  </g>

  <rect x="145" y="558" width="172" height="48" rx="24" fill="#778873"/>
  <text x="231" y="588" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#171717">Join the waitlist</text>

  <!-- Palette -->
  <rect x="1055" y="126" width="455" height="240" rx="34" fill="#FDF6ED" stroke="#DCCFC0"/>
  <text x="1095" y="174" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5D685F">COLOR TERRAIN</text>

  <rect x="1095" y="203" width="80" height="92" rx="22" fill="#778873"/>
  <text x="1135" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">TRAIL</text>
  <text x="1135" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">#778873</text>

  <rect x="1191" y="203" width="80" height="92" rx="22" fill="#A1BC98"/>
  <text x="1231" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">MEADOW</text>
  <text x="1231" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">#A1BC98</text>

  <rect x="1287" y="203" width="80" height="92" rx="22" fill="#DCCFC0"/>
  <text x="1327" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">SAND</text>
  <text x="1327" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">#DCCFC0</text>

  <rect x="1383" y="203" width="80" height="92" rx="22" fill="#FDF6ED" stroke="#DCCFC0"/>
  <text x="1423" y="318" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">CREAM</text>
  <text x="1423" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" fill="#5D685F">#FDF6ED</text>

  <!-- Type -->
  <rect x="1055" y="392" width="455" height="254" rx="34" fill="#DCCFC0"/>
  <text x="1095" y="438" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5D685F">TYPE VOICE</text>
  <text x="1095" y="505" font-family="Geist, Inter, Arial, sans-serif" font-size="44" font-weight="500" fill="#1F1F1F">Adventure</text>
  <text x="1095" y="553" font-family="Geist, Inter, Arial, sans-serif" font-size="44" font-weight="500" fill="#1F1F1F">together.</text>
  <text x="1097" y="594" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5D685F">Geist for clarity. Inter for calm reading.</text>
  <line x1="1095" y1="614" x2="1470" y2="614" stroke="#A1BC98"/>
  <text x="1097" y="633" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.4" fill="#778873">FRIENDLY · MODERN · RELIABLE · OUTDOOR-FIRST</text>

  <!-- Bottom row -->
  <rect x="90" y="682" width="474" height="218" rx="34" fill="#FDF6ED" stroke="#DCCFC0"/>
  <text x="125" y="728" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#5D685F">CONNECTED CARDS</text>
  <rect x="125" y="755" width="124" height="112" rx="24" fill="#A1BC98"/>
  <rect x="265" y="755" width="124" height="112" rx="24" fill="#1F1F1F"/>
  <rect x="405" y="755" width="124" height="112" rx="24" fill="#DCCFC0"/>
  <path d="M143 830C190 786 222 843 282 814S364 793 423 830S489 808 514 790" fill="none" stroke="#778873" stroke-width="5" stroke-linecap="round"/>
  <circle cx="165" cy="812" r="9" fill="#171717"/>
  <circle cx="305" cy="805" r="9" fill="#FDF6ED"/>
  <circle cx="461" cy="822" r="9" fill="#778873"/>
  <text x="143" y="782" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#171717">PLAN</text>
  <text x="283" y="782" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#FDF6ED">PACK</text>
  <text x="423" y="782" font-family="Geist, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F1F1F">OFFLINE</text>

  <!-- Shapes -->
  <rect x="594" y="682" width="474" height="218" rx="34" fill="#2C352F"/>
  <rect x="594" y="682" width="474" height="218" rx="34" fill="url(#contourPattern)"/>
  <text x="629" y="728" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#A1BC98">MOTION LANGUAGE</text>
  <path d="M632 815C690 765 743 765 798 815S909 865 1027 770" fill="none" stroke="#A1BC98" stroke-width="6" stroke-linecap="round"/>
  <circle cx="674" cy="790" r="14" fill="#FDF6ED"/>
  <circle cx="706" cy="778" r="14" fill="#778873"/>
  <path d="M854 823l11 11 20-26" fill="none" stroke="#FDF6ED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="630" y="874" font-family="Inter, Arial, sans-serif" font-size="13" fill="#DCCFC0">No bounce. Gentle draw. Purposeful change.</text>

  <!-- Photography direction -->
  <g clip-path="url(#photoClip)">
    <rect x="1108" y="682" width="402" height="218" fill="url(#photoWash)"/>
    <circle cx="1210" cy="806" r="52" fill="#A3B9A5" opacity="0.7"/>
    <circle cx="1280" cy="796" r="48" fill="#718B75" opacity="0.8"/>
    <circle cx="1354" cy="812" r="54" fill="#536D59" opacity="0.9"/>
    <path d="M1125 928C1190 848 1260 881 1314 855S1424 844 1495 920" fill="#18281F" opacity="0.8"/>
    <path d="M1138 720C1228 777 1338 721 1508 755" fill="none" stroke="#D7E6D9" stroke-opacity="0.2" stroke-width="18"/>
    <rect x="1144" y="856" width="185" height="58" rx="12" fill="#FDF6ED" transform="rotate(-4 1144 856)" opacity="0.92"/>
    <path d="M1165 885C1206 860 1249 902 1300 874" fill="none" stroke="#778873" stroke-width="3"/>
    <circle cx="1207" cy="795" r="16" fill="#C8A88F"/>
    <circle cx="1278" cy="786" r="16" fill="#B98C75"/>
    <circle cx="1352" cy="800" r="16" fill="#D1AE92"/>
  </g>
  <rect x="1108" y="682" width="402" height="218" rx="32" fill="none" stroke="#DCCFC0"/>
  <rect x="1138" y="706" width="192" height="34" rx="17" fill="#FDF6ED" opacity="0.94"/>
  <text x="1234" y="728" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#171717">GENUINE FRIENDSHIP · NATURAL LIGHT</text>
  <text x="1138" y="926" font-family="Inter, Arial, sans-serif" font-size="13" fill="#5D685F">Photography framing: collaborative, candid, grounded.</text>

  <!-- Footer note -->
  <line x1="90" y1="958" x2="1510" y2="958" stroke="#DCCFC0"/>
  <text x="90" y="983" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5D685F">ORIGINAL DIRECTIONAL ARTWORK · REFERENCE ONLY · NO PRODUCTION ASSETS SELECTED</text>
  <text x="1510" y="983" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5D685F">ACCOMP · 2026-07-26</text>
</svg>
